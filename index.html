<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Activity Recommender</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Weather Activity Recommender</h1>
            <p class="subtitle">Search a place to auto-load its weather, or fill in conditions manually</p>
        </header>

        <section class="input-section">
            <!-- Location search -->
            <div class="location-row">
                <div class="location-input-wrap">
                    <span class="location-icon">📍</span>
                    <input type="text" id="locationInput" placeholder="Search a city or place… e.g. Tokyo, Paris, New York" autocomplete="off" />
                    <ul id="locationSuggestions" class="suggestions-list hidden"></ul>
                </div>
                <button id="fetchWeatherBtn" class="fetch-btn">
                    <span id="fetchBtnText">Get Weather</span>
                    <span id="fetchSpinner" class="spinner hidden"></span>
                </button>
                <button id="geoBtn" class="geo-btn" title="Use my location">
                    <span id="geoBtnIcon">🎯</span>
                </button>
            </div>
            <div id="locationStatus" class="location-status hidden"></div>

            <div class="divider"><span>or set manually</span></div>

            <div class="form-row">
                <div class="form-group">
                    <label for="condition">Weather Condition</label>
                    <select id="condition">
                        <option value="sunny">Sunny</option>
                        <option value="partly-cloudy">Partly Cloudy</option>
                        <option value="cloudy">Cloudy / Overcast</option>
                        <option value="rainy">Rainy</option>
                        <option value="thunderstorm">Thunderstorm</option>
                        <option value="snowy">Snowy</option>
                        <option value="windy">Windy</option>
                        <option value="foggy">Foggy</option>
                        <option value="hot">Hot / Heatwave</option>
                        <option value="cold">Cold / Freezing</option>
                        <option value="humid">Humid</option>
                        <option value="hail">Hail</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="temperature">Temperature</label>
                    <div class="temp-input">
                        <input type="number" id="temperature" placeholder="e.g. 22" min="-60" max="60">
                        <div class="unit-toggle">
                            <button class="unit-btn" data-unit="F">&#176;F</button>
                            <button class="unit-btn active" data-unit="C">&#176;C</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="wind">Wind</label>
                    <select id="wind">
                        <option value="calm">Calm</option>
                        <option value="light">Light Breeze</option>
                        <option value="moderate">Moderate Wind</option>
                        <option value="strong">Strong Wind</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="timeOfDay">Time of Day</label>
                    <select id="timeOfDay">
                        <option value="morning">Morning</option>
                        <option value="afternoon">Afternoon</option>
                        <option value="evening">Evening</option>
                        <option value="night">Night</option>
                    </select>
                </div>
            </div>

            <button id="recommendBtn" class="primary-btn">Get Recommendations</button>
        </section>

        <section id="results" class="results-section hidden">
            <div class="forecast-summary">
                <h2>Your Forecast</h2>
                <div id="forecastDisplay" class="forecast-card"></div>
            </div>

            <!-- 7-day forecast strip (only shown when fetched from API) -->
            <div id="weekForecastSection" class="week-forecast-section hidden">
                <h2>7-Day Outlook</h2>
                <div id="weekForecastStrip" class="week-forecast-strip"></div>
            </div>

            <div class="recommendations">
                <h2>Recommended Activities</h2>
                <div id="activityGrid" class="activity-grid"></div>
            </div>

            <div class="tips-section">
                <h2>Quick Tips</h2>
                <div id="tipsList" class="tips-list"></div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
