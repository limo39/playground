<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </radialGradient>
    <radialGradient id="cloudGrad" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </radialGradient>
  </defs>

  <!-- Sun rays -->
  <g stroke="#facc15" stroke-width="1.5" stroke-linecap="round" opacity="0.9">
    <line x1="10" y1="5"  x2="10" y2="2.5"/>
    <line x1="15" y1="3.5" x2="14" y2="1"/>
    <line x1="5"  y1="8"  x2="2.5" y2="7"/>
    <line x1="3.5" y1="13" x2="1"  y2="12"/>
    <line x1="5"  y1="18" x2="2.5" y2="19.5"/>
  </g>

  <!-- Sun circle -->
  <circle cx="10" cy="13" r="5.5" fill="url(#sunGrad)"/>

  <!-- Cloud body -->
  <circle cx="15" cy="21" r="5"   fill="url(#cloudGrad)"/>
  <circle cx="20" cy="19" r="6"   fill="url(#cloudGrad)"/>
  <circle cx="25" cy="21" r="4.5" fill="url(#cloudGrad)"/>
  <rect x="15" y="21" width="10" height="5" rx="0" fill="url(#cloudGrad)"/>

  <!-- Rain drops -->
  <g fill="#38bdf8" opacity="0.95">
    <ellipse cx="18" cy="29" rx="1" ry="1.4"/>
    <ellipse cx="22" cy="30" rx="1" ry="1.4"/>
    <ellipse cx="26" cy="29" rx="1" ry="1.4"/>
  </g>
</svg>
